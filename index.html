<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Losungsjager | Caçador de Soluções</title>
    <style>
        /* Variáveis de Cores para facilitar a edição */
        :root {
            --bg-color: #0f172a; /* Azul muito escuro */
            --text-color: #f8fafc; /* Branco suave */
            --accent-color: #06b6d4; /* Ciano Neon */
            --accent-hover: #0891b2;
        }

        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navegação */
        header {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Seção Principal (Hero) */
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: fadeInDown 1s ease-out;
        }

        .hero p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin-bottom: 30px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        /* Botão com efeito Neon */
        .btn-neon {
            padding: 15px 30px;
            font-size: 1.2rem;
            color: var(--accent-color);
            background: transparent;
            border: 2px solid var(--accent-color);
            border-radius: 5px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .btn-neon:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--accent-color), 0 0 40px var(--accent-color), 0 0 80px var(--accent-color);
        }

        /* Animações */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade para celulares */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Losungs<span>jager</span></a>
        <nav>
            <a href="#sobre">Sobre</a>
            <a href="#projetos">Projetos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Construindo o Futuro</h1>
        <p>Desenvolvimento, tecnologia e soluções caçadas a dedo para os seus maiores desafios. Bem-vindo ao meu espaço na web.</p>
        <a href="#projetos" class="btn-neon">Ver Projetos</a>
    </section>

</body>
</html>
